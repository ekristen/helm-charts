{{- if and .Values.serviceMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "universal.labels" . | nindent 4 }}
{{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
{{- end }}
spec:
  endpoints:
    - path: {{ .Values.metrics.path | default "/metrics" }}
      port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "universal.selectorLabels" . | nindent 6 }}
{{- end -}}
