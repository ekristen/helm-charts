# Replica Count: How many instances of the application to run
replicaCount: 1

# Min Ready Seconds: How long to wait before marking a pod as ready
minReadySeconds: 90

# Image: The container image to use for the application
image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: 6.1.4
  pullPolicy: IfNotPresent
  pullSecret: null

# Strategy: The deployment strategy to use for updating the application
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1

# Container: The container configuration for the application
container:
  name: pod-info
  port: 4315
  args:
    - api-server

# Metrics: The metrics configuration for the application
metrics:
  enabled: false
  path: /metrics
  port: 4316

## Deployment annotations
annotations: {}

## Deployment labels
labels: {}

affinity: {}

tolerations: []
# - key: CriticalAddonsOnly
#  operator: Exists

# Container: Security Context
# WARNING: ignored if `containers` is used
securityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999

# Pod: Security
podSecurityContext: {}

## Pod Annotations
podAnnotations: {}

## Pod Labels
podLabels: {}

# Service: The service configuration for the application
service:
  enabled: true
  annotations: {}
  type: ClusterIP
  ports: []
    - name: metrics
      port: 9797
      targetPort: 9797
    - name: http
      port: 9898
      targetPort: 9898
    - name: external
      port: 9898
      targetPort: 9898
    - name: grpc
      port: 9999
      service: podinfo

## Extra environment variables that will be pass into pods
## WARNING: Ignored if `containers` is used
env: {}
#  key: value
#  key: value

## Extra environment variables (from existing secrets) that will be pass into pods
## WARNING: Ignored if `containers` is used
envFromSecret: {}
# ENV_VAR:
#   secretName: app-secret
#   secretKeyRef: first-key

## These define the limits and requests of the container.
## Suggestion: avoid limits unless you really know what you are doing, rely on requests instead
## WARNING: Ignored if `containers` is used
resources: {}
#  limits:
#    cpu: "1.0"
#    memory: 1024Mi
#  requests:
#    cpu: 200m
#    memory: 1024Mi

autoscaling:
  enabled: false
  minReplicas: 2 # Note: uses replicaCount if this is nil or missing
  maxReplicas: 5
  cpu: 80
  memory: 80
  request: 80
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

serviceAccount:
  enabled: false

serviceMonitor:
  enabled: false
  interval: 15s
  labels: {}

ingress:
  enabled: false
  tls:
    enabled: true
    secret: null
  host: dockit.example.org
  path: /
  pathType: Prefix
  #  path: / (default)
  #   annotations:
  #     certmanager.k8s.io/acme-challenge-type: "http01"
  #     certmanager.k8s.io/cluster-issuer: "letsencrypt"
  #     kubernetes.io/tls-acme: "true"
  additionalPaths: {}
  #    - path: "/api"
  #      serviceName: xyz
  #      servicePort: 80

## Secret mounts & volume mounts
# Defines mounts with secrets. Secrets must be manually created in the namespace.
volumes:
  enabled: false
  volumes: []
  #  - name: cache-volume
  #    emptyDir: {}
  volumeMounts: []
  #  - path: /cache
  #    name: cache-volume
  secretVolumeMounts: []
  #   - name: secret-files
  #     path: /etc/secrets
  #     items:
  #     - key: blah
  #     - path: </etc/secrets>/blah
  #   - name: secret-files
  #     path: /etc/secrets
  secretVolumes: []
  #   - name: secret-files
  #     secretName: some-secret-files
  #   - name: secret-files
  #     secretName: some-secret-files
  configMapVolumeMounts: []
  #      - name: config-map-files
  #        path: /etc/config
  configMapVolumes:
  #      - name: config-map-files
  #        configMapName: config-map-name

configMaps: {}

# WARNING: ADVANCED: you can control every setting of all containers but all the simplicity
# that this chart provides goes out the window.
containers: []

probes:
  startupProbe: {}
  # Readiness Probe: The probe to use for checking if the application is ready
  readinessProbe: {}
    # httpGet:
    #   path: /healthz
    #   port: 4315
    # initialDelaySeconds: 60
    # timeoutSeconds: 30
    # failureThreshold: 24
  # Liveness Probe: The probe to use for checking if the application is alive
  livenessProbe: {}
    # httpGet:
    #   path: /healthz
    #   port: 4315
    # initialDelaySeconds: 60
    # timeoutSeconds: 30
    # failureThreshold: 24
