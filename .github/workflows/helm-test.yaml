name: Helm Chart Tests

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/helm-test.yaml'
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/helm-test.yaml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Lint charts
        run: |
          for chart in charts/*/; do
            echo "Linting $chart"
            helm lint "$chart"
          done

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest

      - name: Run unit tests
        run: |
          for chart in charts/*/; do
            if [ -d "${chart}tests" ]; then
              echo "Testing $chart"
              helm unittest "$chart"
            fi
          done

  template:
    name: Template Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0

      - name: Build dependencies
        run: |
          for chart in charts/*/; do
            if [ -f "${chart}Chart.lock" ]; then
              echo "Building dependencies for $chart"
              helm dependency build "$chart" || true
            fi
          done

      - name: Validate templates render
        run: |
          for chart in charts/*/; do
            echo "Validating $chart"
            helm template test "$chart" > /dev/null || echo "Skipped $chart (missing dependencies)"
          done

      - name: Validate with example values
        run: |
          for chart in charts/*/; do
            if [ -d "${chart}_examples" ]; then
              for values in ${chart}_examples/*.yaml; do
                echo "Testing $chart with $values"
                helm template test "$chart" -f "$values" > /dev/null || echo "Skipped $values"
              done
            fi
          done
