# Container with ingress, cert-manager TLS, and external-dns
# Usage: helm install myapp ./charts/universal -f _examples/container-with-ingress.yaml

image:
  repository: nginx
  tag: "1.25"

container:
  port: 80

env:
  LOG_LEVEL: info

service:
  enabled: true
  ports:
    http:
      port: 80
      targetPort: 80

ingress:
  enabled: true
  host: myapp.example.com
  path: /
  pathType: Prefix
  annotations:
    # cert-manager: request TLS certificate
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # external-dns: create DNS record
    external-dns.alpha.kubernetes.io/hostname: myapp.example.com
    external-dns.alpha.kubernetes.io/ttl: "300"
  tls:
    enabled: true
    # cert-manager will create this secret automatically
    secret: myapp-tls

resources:
  requests:
    cpu: 100m
    memory: 128Mi
