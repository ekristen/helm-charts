{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    universal/app-name: {{ .Release.Name }}
    universal/app-version: {{ .Chart.AppVersion }}
  {{- if .Values.ingress.annotations }}
  annotations:
  {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
spec:
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
        - path: {{ default "/" .Values.ingress.path }}
          backend:
            service:
              name: {{ $.Release.Name }}
              port:
                number: 80
          pathType: {{ or .Values.ingress.pathType "ImplementationSpecific" }}
        {{- range $path := .Values.ingress.additionalPaths }}
        - path: {{ $path.path }}
          backend:
            service:
              name: {{ $path.serviceName }}
              port:
                number: {{ $path.servicePort }}
          pathType: {{ or $path.pathType "ImplementationSpecific" }}
        {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    {{- if .Values.ingress.tls.secret }}
    secretName: "{{ .Values.ingress.tls.secret }}"
    {{- else }}
    secretName: {{ $.Release.Name }}
    {{- end }}
  {{- end }}
{{- end -}}
