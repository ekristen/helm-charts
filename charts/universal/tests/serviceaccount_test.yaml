# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: serviceaccount tests
templates:
  - service-account.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when enabled
    set:
      serviceAccount:
        enabled: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME

  - it: should set correct namespace
    release:
      namespace: production
    set:
      serviceAccount:
        enabled: true
    asserts:
      - equal:
          path: metadata.namespace
          value: production

  - it: should set annotations
    set:
      serviceAccount:
        enabled: true
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/my-role
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123456789:role/my-role

  - it: should set labels
    set:
      serviceAccount:
        enabled: true
    asserts:
      - equal:
          path: metadata.labels["universal/app-name"]
          value: RELEASE-NAME
