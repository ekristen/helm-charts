# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: cronjob tests
templates:
  - cronjob.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when workloadType is cronjob
    set:
      workloadType: cronjob
      cronjob:
        schedule: "0 * * * *"
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: RELEASE-NAME

  - it: should set schedule
    set:
      workloadType: cronjob
      cronjob:
        schedule: "*/15 * * * *"
    asserts:
      - equal:
          path: spec.schedule
          value: "*/15 * * * *"

  - it: should set concurrencyPolicy
    set:
      workloadType: cronjob
      cronjob:
        schedule: "0 * * * *"
        concurrencyPolicy: Replace
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: Replace

  - it: should set history limits
    set:
      workloadType: cronjob
      cronjob:
        schedule: "0 * * * *"
        successfulJobsHistoryLimit: 5
        failedJobsHistoryLimit: 3
    asserts:
      - equal:
          path: spec.successfulJobsHistoryLimit
          value: 5
      - equal:
          path: spec.failedJobsHistoryLimit
          value: 3

  - it: should set restartPolicy
    set:
      workloadType: cronjob
      cronjob:
        schedule: "0 * * * *"
        restartPolicy: Never
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.restartPolicy
          value: Never

  - it: should use same image config as deployment
    set:
      workloadType: cronjob
      cronjob:
        schedule: "0 * * * *"
      image:
        repository: alpine
        tag: "3.19"
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].image
          value: alpine:3.19

  - it: should use same env vars as deployment
    set:
      workloadType: cronjob
      cronjob:
        schedule: "0 * * * *"
      env:
        DATABASE_URL: postgres://localhost/db
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: "DATABASE_URL"
            value: "postgres://localhost/db"

  - it: should use same envFromSecret as deployment
    set:
      workloadType: cronjob
      cronjob:
        schedule: "0 * * * *"
      envFromSecret:
        DB_PASSWORD:
          secretName: my-secret
          key: password
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: "DB_PASSWORD"
            valueFrom:
              secretKeyRef:
                name: my-secret
                key: password

  - it: should set container command and args
    set:
      workloadType: cronjob
      cronjob:
        schedule: "0 * * * *"
      container:
        command:
          - /bin/sh
          - -c
        args:
          - echo hello
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].command
          value:
            - /bin/sh
            - -c
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].args
          value:
            - echo hello

  - it: should set resources
    set:
      workloadType: cronjob
      cronjob:
        schedule: "0 * * * *"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources.requests.cpu
          value: 50m

  - it: should set security context
    set:
      workloadType: cronjob
      cronjob:
        schedule: "0 * * * *"
      securityContext:
        runAsUser: 1001
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.securityContext.runAsUser
          value: 1001
