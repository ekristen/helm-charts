# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: ingress tests
templates:
  - ingress.yaml
tests:
  - it: should not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should render when enabled
    set:
      ingress:
        enabled: true
        host: app.example.com
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.name
          value: RELEASE-NAME

  - it: should set host
    set:
      ingress:
        enabled: true
        host: myapp.example.com
    asserts:
      - equal:
          path: spec.rules[0].host
          value: myapp.example.com

  - it: should set default path
    set:
      ingress:
        enabled: true
        host: app.example.com
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Prefix

  - it: should set custom path
    set:
      ingress:
        enabled: true
        host: app.example.com
        path: /api
        pathType: Exact
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /api
      - equal:
          path: spec.rules[0].http.paths[0].pathType
          value: Exact

  - it: should set backend service
    set:
      ingress:
        enabled: true
        host: app.example.com
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: RELEASE-NAME
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 80

  - it: should set annotations
    set:
      ingress:
        enabled: true
        host: app.example.com
        annotations:
          kubernetes.io/ingress.class: nginx
          nginx.ingress.kubernetes.io/ssl-redirect: "true"
    asserts:
      - equal:
          path: metadata.annotations["kubernetes.io/ingress.class"]
          value: nginx

  - it: should set cert-manager annotation
    set:
      ingress:
        enabled: true
        host: app.example.com
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-prod
    asserts:
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt-prod

  - it: should set external-dns annotation
    set:
      ingress:
        enabled: true
        host: app.example.com
        annotations:
          external-dns.alpha.kubernetes.io/hostname: app.example.com
    asserts:
      - equal:
          path: metadata.annotations["external-dns.alpha.kubernetes.io/hostname"]
          value: app.example.com

  - it: should not render TLS by default
    set:
      ingress:
        enabled: true
        host: app.example.com
    asserts:
      - isNull:
          path: spec.tls

  - it: should render TLS when enabled
    set:
      ingress:
        enabled: true
        host: app.example.com
        tls:
          enabled: true
    asserts:
      - equal:
          path: spec.tls[0].hosts[0]
          value: app.example.com

  - it: should use default TLS secret name
    set:
      ingress:
        enabled: true
        host: app.example.com
        tls:
          enabled: true
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: RELEASE-NAME-tls

  - it: should use custom TLS secret name
    set:
      ingress:
        enabled: true
        host: app.example.com
        tls:
          enabled: true
          secret: my-custom-tls
    asserts:
      - equal:
          path: spec.tls[0].secretName
          value: my-custom-tls

  - it: should set correct namespace
    release:
      namespace: production
    set:
      ingress:
        enabled: true
        host: app.example.com
    asserts:
      - equal:
          path: metadata.namespace
          value: production
