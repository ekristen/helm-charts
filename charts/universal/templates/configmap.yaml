{{- range $configMapName, $configMap := .Values.configMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $configMapName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    universal/app-name: {{ $.Release.Name }}
    universal/app-version: {{ $.Release.appVersion }}
{{- with $configMap.labels }}
{{- toYaml . | nindent 4 }}
{{- end }}
data:
{{- toYaml $configMap.data | nindent 4 }}
{{- end }}
